[project]
name = "repopilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The benchmark cases are deliberately buggy projects; they must not be linted or "fixed".
extend-exclude = ["bench/cases", "bench/results"]
