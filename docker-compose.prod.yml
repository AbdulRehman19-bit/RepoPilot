# Production-shaped stack: Postgres, Redis, the API, and Caddy (TLS + the built frontend).
# The WORKER is not here on purpose: it starts sandbox containers, and giving a container the
# Docker socket is root on the host. Run it on the host (docs/deploy.md); that is why Postgres and
# Redis publish a port, on loopback only.
#
#   cp .env.prod.example .env.prod      # then fill it in
#   (cd frontend && npm ci && npm run build)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
name: repopilot-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: repopilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    build: &api_build
      context: .
      dockerfile: docker/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: &api_env
      REPOPILOT_ENVIRONMENT: production
      REPOPILOT_DATABASE_URL: postgresql+psycopg://repopilot:${POSTGRES_PASSWORD}@postgres:5432/repopilot
      REPOPILOT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api_build
    restart: unless-stopped
    # Caddy is on the same network, so uvicorn trusts its X-Forwarded-For (per-address limits).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *api_env
      REPOPILOT_FRONTEND_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS in .env.prod}
      REPOPILOT_SESSION_COOKIE_SECURE: "true"
      REPOPILOT_GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      REPOPILOT_GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      REPOPILOT_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      REPOPILOT_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      REPOPILOT_GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_key
      REPOPILOT_API_TOKENS: ${API_TOKENS:-}
      REPOPILOT_REQUIRE_SEPARATE_REVIEWER: ${REQUIRE_SEPARATE_REVIEWER:-false}
    secrets:
      - github_app_key
    read_only: true
    tmpfs:
      - /tmp
      - /workspaces:uid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

secrets:
  github_app_key:
    file: ${GITHUB_APP_KEY_FILE:-./deploy/no-key.txt}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
